<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grimoire — a Shadowdark RPG companion</title>
<meta name="description" content="Grimoire is a companion app for running and playing Shadowdark RPG — for players, for the GM, and for AI-run tables.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Pirata+One&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg: #050506;
    --panel: #101013;
    --line: #232329;
    --ink: #f4f4f6;
    --ink-dim: #a5a5ae;
    --green: #39ff8f;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .hero{
    min-height: 100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 40px 24px;
    position:relative;
    overflow:hidden;
  }

  .glow-orb{
    position:absolute;
    border-radius:999px;
    filter: blur(70px);
    pointer-events:none;
    z-index:0;
  }
  .glow-1{ width:420px; height:420px; background: rgba(155,92,255,0.20); top:8%; left:50%; margin-left:-330px; }
  .glow-2{ width:360px; height:360px; background: rgba(53,240,255,0.14); top:14%; left:50%; margin-left:20px; }
  .glow-3{ width:320px; height:320px; background: rgba(255,63,214,0.10); top:45%; left:50%; margin-left:-460px; }

  .hero > *:not(.glow-orb){ position:relative; z-index:1; }

  .hero-logo-mark{
    width: min(200px, 50vw);
    height:auto;
    margin: 0 auto 18px;
    display:block;
    filter: drop-shadow(0 0 34px rgba(255,255,255,0.10));
  }

  .hero-wordmark{
    font-family: 'Pirata One', serif;
    font-size: clamp(52px, 9vw, 80px);
    line-height: 1;
    letter-spacing: -0.015em;
    text-shadow: 0 0 40px rgba(255,255,255,0.12);
    margin-bottom: 28px;
  }

  .tagline{
    font-size: 15.5px;
    line-height: 1.65;
    color: var(--ink-dim);
    max-width: 500px;
    margin: 0 auto 38px;
  }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap: 7px;
    padding: 6px 14px;
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.03em;
    color: var(--ink-dim);
  }
  .eyebrow .dot{
    width:6px; height:6px; border-radius:999px;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
  }
</style>
</head>
<body>
  <main class="hero">
    <div class="glow-orb glow-1"></div>
    <div class="glow-orb glow-2"></div>
    <div class="glow-orb glow-3"></div>

    <img class="hero-logo-mark" src="/logo.webp" alt="Grimoire logo — an illuminated letter G">
    <div class="hero-wordmark">GRIMOIRE</div>

    <p class="tagline">A companion for running and playing Shadowdark RPG — for the player watching their torch burn down, the GM keeping the table moving, and the AI standing in when no human GM is at the wheel.</p>

    <div class="eyebrow"><span class="dot"></span> In development — nothing to sign up for yet</div>
  </main>
</body>
</html>
